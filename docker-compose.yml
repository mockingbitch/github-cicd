version: '3.9'

services:
    app:
        build:
            context: ./.docker/php
            dockerfile: Dockerfile
        container_name: app
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        networks:
            - laravel

    web:
        image: nginx:stable
        container_name: web
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - .:/var/www/html
            - ./.docker/server/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    db:
        image: mysql:8.0
        container_name: db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        ports:
            - "3301:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - laravel

networks:
    laravel:

volumes:
    db_data:
